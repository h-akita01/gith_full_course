info:
  name: 03 Delete Created Post
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{baseUrl}}/posts/{{newPostId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
