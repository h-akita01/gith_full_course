info:
  name: Q2 Check Todo 1
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/todos/1"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.completed
      operator: eq
      value: "false"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
